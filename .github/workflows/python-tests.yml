name: Python tests

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  unittest:
    name: CPU unit tests
    runs-on: ubuntu-latest
    env:
      CUDA_VISIBLE_DEVICES: ""
      HF_DATASETS_OFFLINE: "1"
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      TOKENIZERS_PARALLELISM: "false"
      WANDB_DISABLED: "true"
      PYTHONHASHSEED: "0"
      PYTHONUTF8: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            scripts/requirements.txt
            scripts/requirements-pretrain.txt

      - name: Install CPU-only PyTorch
        run: python -m pip install --index-url https://download.pytorch.org/whl/cpu "torch==2.7.1+cpu"

      - name: Install project dependencies
        run: python -m pip install -r scripts/requirements-pretrain.txt

      - name: Run unit tests
        run: python -B -m unittest discover -s scripts -p 'test_*.py' -v
